[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "Retrieval-augmented knowledge assistant: ingest documents, embed them into pgvector and answer questions with citations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ho Chai Kwok" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pypdf>=4.2",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0"]
openai = ["openai>=1.40"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
rag-assistant = "rag_assistant.api.app:run"
rag-cli = "rag_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a real Postgres + pgvector database (set TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag_assistant"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*", "openai.*", "pypdf.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["rag_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
